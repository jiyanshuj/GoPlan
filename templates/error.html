<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .error-container {
            background-color: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #ef4444;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.125rem;
            margin-bottom: 30px;
            color: #e0e7ff;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1><i class="fas fa-triangle-exclamation" style="color: #ef4444; margin-right: 8px;"></i>Error</h1>
        <p>{{ message }}</p>
        <a href="{% url 'trip_view' %}" class="btn">Try Again</a>
    </div>
</body>
</html>
